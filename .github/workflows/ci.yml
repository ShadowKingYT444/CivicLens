name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEMO_MODE: "true"
  ENABLE_NIM: "false"
  ENABLE_GROQ: "false"
  ENABLE_LLM: "false"
  STORE_ANALYSES: "false"
  STORE_RAW_INPUTS: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Lint
        run: pnpm lint 2>&1 | tee lint.log
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee typecheck.log
      - name: Unit tests
        run: pnpm test 2>&1 | tee unit-tests.log
      - name: Production build
        run: pnpm build 2>&1 | tee build.log
      - name: Upload quality failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-${{ github.run_id }}
          path: "*.log"
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm demo:build
      - run: pnpm exec playwright test tests/e2e tests/mobile-ui.spec.ts --project=chromium --project=mobile-390 --project=mobile-430
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python scripts/build-android.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: CivicLens-demo-apk
          path: artifacts/android/CivicLens-demo.apk
